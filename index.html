<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CamLink P2P - Android Live Cam</title>
  
  <!-- PeerJS WebRTC & QR Code Generator -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #f0f6fc;
      --muted: #8b949e;
      --primary: #238636;
      --primary-hover: #2ea043;
      --blue: #2f81f7;
      --blue-hover: #388bfd;
      --danger: #da3633;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      color: #fff;
    }

    p.subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-primary:active { background: var(--primary-hover); }
    .btn-blue { background: var(--blue); color: #fff; width: 100%; }
    .btn-blue:active { background: var(--blue-hover); }
    .btn-secondary { background: #21262d; color: var(--text); border: 1px solid var(--border); width: 100%; }
    .btn-danger { background: var(--danger); color: #fff; }

    input {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--blue);
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Host Active Pairing Screen */
    .host-live-box {
      display: none;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
      text-align: center;
    }

    .room-badge {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: #58a6ff;
      margin: 10px 0;
      font-family: monospace;
    }

    #qrBox {
      background: #fff;
      padding: 12px;
      border-radius: 10px;
      display: inline-block;
      margin: 12px auto;
    }

    .preview-thumb {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      object-fit: cover;
      background: #000;
      margin-top: 12px;
      border: 1px solid var(--border);
    }

    /* Video Fullscreen Viewport */
    .viewport {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      flex-direction: column;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .floating-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .floating-bar * {
      pointer-events: auto;
    }

    .status-pill {
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #238636;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .controls-bottom {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 14px;
      padding: 0 16px;
      z-index: 10;
    }

    .circle-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      padding: 0;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 1.2rem;
    }

    .unmute-alert {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: #2f81f7;
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 15;
      display: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Screen 1: Mode Selection & Setup -->
  <div class="container" id="setupCard">
    <div class="card">
      <h1>CamLink P2P</h1>
      <p class="subtitle">Direct Android Camera Stream</p>

      <div class="btn-group">
        <button class="btn-primary" id="btnModeHost" onclick="switchMode('host')">Host Camera</button>
        <button class="btn-secondary" id="btnModeViewer" onclick="switchMode('viewer')">Viewer</button>
      </div>

      <!-- Host Configuration -->
      <div id="hostSection">
        <div id="hostConfigForm">
          <label>Passcode Protection</label>
          <input type="text" id="hostPasscode" value="mycam" placeholder="Set room passcode">
          <button class="btn-primary" id="btnInitHost" onclick="startBroadcasting()">Start Camera & Broadcast</button>
        </div>

        <!-- Visible Pairing Box for Host -->
        <div class="host-live-box" id="hostLiveBox">
          <p style="font-size:0.8rem; color:var(--muted); text-transform:uppercase; font-weight:700;">Broadcaster Room ID</p>
          <div class="room-badge" id="displayRoomId">------</div>

          <div id="qrBox"></div>

          <p style="font-size:0.82rem; color:var(--muted); margin-bottom:12px;">
            Scan with Viewer Android or enter the 6-digit ID above.
          </p>

          <button class="btn-secondary" style="margin-bottom:10px;" onclick="copyHostLink()">📋 Copy Full Invite Link</button>
          <button class="btn-blue" onclick="openHostFullscreen()">🔍 View Fullscreen Cam</button>

          <!-- Small live preview so host knows the camera is running -->
          <video id="hostPreviewVideo" class="preview-thumb" autoplay playsinline muted></video>
        </div>
      </div>

      <!-- Viewer Configuration -->
      <div id="viewerSection" style="display: none;">
        <label>Broadcaster Room ID</label>
        <input type="text" id="targetRoomId" placeholder="Enter 6-digit ID (e.g. 542198)">

        <label>Passcode</label>
        <input type="password" id="joinPasscode" value="mycam" placeholder="Enter passcode">

        <button class="btn-blue" onclick="joinStream()">Connect to Camera</button>
      </div>
    </div>
  </div>

  <!-- Screen 2: Fullscreen Stream Viewport -->
  <div class="viewport" id="viewport">
    <div class="floating-bar">
      <div class="status-pill">
        <span class="dot"></span>
        <span id="statusText">Live</span>
      </div>
      <button class="btn-danger" style="padding: 6px 12px; font-size: 0.8rem;" onclick="stopAll()">Exit</button>
    </div>

    <!-- Receiver Unmute Banner -->
    <div class="unmute-alert" id="unmuteBanner" onclick="unmuteAudio()">
      🔊 Tap to Enable Audio
    </div>

    <!-- Active Video -->
    <video id="liveVideo" autoplay playsinline webkit-playsinline></video>

    <!-- Controls -->
    <div class="controls-bottom">
      <button class="circle-btn" id="btnFlipCam" title="Switch Camera" onclick="toggleFacingCamera()">🔄</button>
      <button class="circle-btn" id="btnSnap" title="Take Snapshot" onclick="captureSnapshot()">📸</button>
      <button class="circle-btn" id="btnMute" title="Mute/Unmute" onclick="toggleMute()">🎙️</button>
    </div>
  </div>

  <canvas id="snapshotCanvas" style="display:none;"></canvas>

  <script>
    let peer = null;
    let localStream = null;
    let currentRole = 'host';
    let currentFacingMode = 'environment';
    let activeCall = null;
    let activeRoomId = '';

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const joinId = params.get('join');
      if (joinId) {
        switchMode('viewer');
        document.getElementById('targetRoomId').value = joinId;
      }
    });

    function switchMode(mode) {
      currentRole = mode;
      document.getElementById('hostSection').style.display = mode === 'host' ? 'block' : 'none';
      document.getElementById('viewerSection').style.display = mode === 'viewer' ? 'block' : 'none';
      
      document.getElementById('btnModeHost').className = mode === 'host' ? 'btn-primary' : 'btn-secondary';
      document.getElementById('btnModeViewer').className = mode === 'viewer' ? 'btn-blue' : 'btn-secondary';
    }

    // --- HOST LOGIC ---
    async function startBroadcasting() {
      const passcode = document.getElementById('hostPasscode').value.trim();
      if (!passcode) return alert('Please set a passcode');

      const btnInit = document.getElementById('btnInitHost');
      btnInit.disabled = true;
      btnInit.innerText = 'Starting Camera...';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: currentFacingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: true
        });

        // Set local thumbnail preview on the setup card
        const previewEl = document.getElementById('hostPreviewVideo');
        previewEl.srcObject = localStream;

        // Also assign to the main viewport video element
        const fullVideo = document.getElementById('liveVideo');
        fullVideo.srcObject = localStream;
        fullVideo.muted = true;

        activeRoomId = generateRoomId();

        peer = new Peer(activeRoomId, {
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' }
            ]
          }
        });

        peer.on('open', (id) => {
          document.getElementById('hostConfigForm').style.display = 'none';
          document.getElementById('hostLiveBox').style.display = 'block';
          document.getElementById('displayRoomId').innerText = id;

          // Render QR Code
          const shareUrl = `${window.location.origin}${window.location.pathname}?join=${id}`;
          const qrBox = document.getElementById('qrBox');
          qrBox.innerHTML = '';
          new QRCode(qrBox, {
            text: shareUrl,
            width: 160,
            height: 160,
            correctLevel: QRCode.CorrectLevel.M
          });
        });

        // Authorize viewers before answering
        peer.on('connection', (conn) => {
          conn.on('data', (data) => {
            if (data.type === 'auth') {
              if (data.passcode === passcode) {
                conn.send({ type: 'auth-success' });
              } else {
                conn.send({ type: 'auth-failed', reason: 'Incorrect passcode' });
              }
            }
          });
        });

        // Answer incoming media call with camera stream
        peer.on('call', (call) => {
          activeCall = call;
          call.answer(localStream);
          document.getElementById('statusText').innerText = "Streaming to Viewer";
        });

        peer.on('error', (err) => {
          alert('Network/Signaling error: ' + err.type);
          btnInit.disabled = false;
          btnInit.innerText = 'Start Camera & Broadcast';
        });

      } catch (err) {
        alert("Camera permission denied: " + err.message);
        btnInit.disabled = false;
        btnInit.innerText = 'Start Camera & Broadcast';
      }
    }

    function openHostFullscreen() {
      showViewport("Host Camera (Active)");
    }

    // --- VIEWER LOGIC ---
    function joinStream() {
      const roomId = document.getElementById('targetRoomId').value.trim();
      const passcode = document.getElementById('joinPasscode').value.trim();

      if (!roomId) return alert('Please enter the 6-digit Broadcaster Room ID');

      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', () => {
        const authConn = peer.connect(roomId);

        authConn.on('open', () => {
          authConn.send({ type: 'auth', passcode: passcode });
        });

        authConn.on('data', (data) => {
          if (data.type === 'auth-success') {
            // Establish media stream connection
            const dummyCtx = new (window.AudioContext || window.webkitAudioContext)();
            const dst = dummyCtx.createMediaStreamDestination();

            const call = peer.call(roomId, dst.stream);
            activeCall = call;

            call.on('stream', (remoteStream) => {
              const videoEl = document.getElementById('liveVideo');
              videoEl.srcObject = remoteStream;
              videoEl.muted = true; // Required by Android Chrome to enable instant visual render

              videoEl.play().then(() => {
                showViewport("Connected - Live Feed");
                document.getElementById('unmuteBanner').style.display = 'block';
              }).catch(() => {
                showViewport("Tap Screen to Play");
              });
            });

            call.on('close', () => {
              alert("Stream has been closed by the broadcaster.");
              stopAll();
            });

          } else if (data.type === 'auth-failed') {
            alert("Passcode rejected: " + data.reason);
            peer.destroy();
          }
        });
      });

      peer.on('error', (err) => {
        alert("Connection failed: " + err.type);
      });
    }

    // --- CONTROLS & UTILITIES ---
    function unmuteAudio() {
      const videoEl = document.getElementById('liveVideo');
      videoEl.muted = false;
      document.getElementById('unmuteBanner').style.display = 'none';
    }

    function toggleMute() {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
          audioTrack.enabled = !audioTrack.enabled;
          document.getElementById('btnMute').innerText = audioTrack.enabled ? '🎙️' : '🔇';
        }
      } else {
        const videoEl = document.getElementById('liveVideo');
        videoEl.muted = !videoEl.muted;
        document.getElementById('btnMute').innerText = videoEl.muted ? '🔇' : '🔊';
      }
    }

    async function toggleFacingCamera() {
      if (currentRole !== 'host' || !localStream) return;

      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      localStream.getVideoTracks().forEach(t => t.stop());

      try {
        const newStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: currentFacingMode } },
          audio: true
        });

        const newVideoTrack = newStream.getVideoTracks()[0];
        localStream.removeTrack(localStream.getVideoTracks()[0]);
        localStream.addTrack(newVideoTrack);

        document.getElementById('liveVideo').srcObject = localStream;
        document.getElementById('hostPreviewVideo').srcObject = localStream;

        if (activeCall && activeCall.peerConnection) {
          const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) sender.replaceTrack(newVideoTrack);
        }
      } catch (err) {
        alert("Failed to flip camera: " + err.message);
      }
    }

    function captureSnapshot() {
      const videoEl = document.getElementById('liveVideo');
      const canvas = document.getElementById('snapshotCanvas');
      if (!videoEl.videoWidth) return alert("Visual feed not ready yet.");

      canvas.width = videoEl.videoWidth;
      canvas.height = videoEl.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

      const a = document.createElement('a');
      a.download = `p2p-snap-${Date.now()}.jpg`;
      a.href = canvas.toDataURL('image/jpeg', 0.95);
      a.click();
    }

    function showViewport(status) {
      document.getElementById('setupCard').style.display = 'none';
      document.getElementById('viewport').style.display = 'flex';
      document.getElementById('statusText').innerText = status;
      document.getElementById('btnFlipCam').style.display = currentRole === 'host' ? 'flex' : 'none';
    }

    function stopAll() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }
      if (peer) {
        peer.destroy();
      }
      window.location.href = window.location.pathname;
    }

    function generateRoomId() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    function copyHostLink() {
      const shareUrl = `${window.location.origin}${window.location.pathname}?join=${activeRoomId}`;
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert("Invite link copied!");
      });
    }
  </script>
</body>
</html>
